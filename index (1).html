<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Member App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0c0a10;--card:#17131d;--card2:#211a29;--line:#2c2437;--pink:#ff4fa3;--gold:#f5c542;--tx:#f4f1f7;--mut:#9b91a9;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:0 14px 40px}.wrap{max-width:900px;margin:0 auto}[hidden]{display:none!important}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:18px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0}
.mut{color:var(--mut);font-size:13px}.gd{color:var(--gold)}.pk{color:var(--pink)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wr{flex-wrap:wrap}.g{flex:1;min-width:0}
input,select{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:10px;padding:11px;font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{border:0;border-radius:10px;background:var(--pink);color:#1a0612;font:inherit;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btn.o{background:none;border:1px solid var(--line);color:var(--tx)}.btn.s{padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tab{border:1px solid var(--line);background:none;color:var(--tx);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;flex:none}
.tab.on{background:var(--pink);border-color:var(--pink);color:#1a0612;font-weight:700}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--gold));display:grid;place-items:center;font-weight:800;color:#1a0612;flex:none}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0}
.num{font-size:26px;font-weight:800}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:5;overflow:auto;padding:14px}.sheet.on{display:block}
.sheet .box{max-width:560px;margin:20px auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:92%;text-align:center}#toast.on{opacity:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}.dot.on{background:var(--ok)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" style="max-width:380px;margin:12vh auto 0" hidden>
    <h1>Admin <span class="pk">Member App</span></h1><p class="mut">Đăng nhập bằng tài khoản nhân viên.</p>
    <div class="card"><label>Email</label><input id="em" type="email" autocomplete="username"><label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div><button class="btn" style="width:100%" id="lgo">Đăng nhập</button></div>
  </div>
  <div id="main" hidden>
    <div class="top"><h1>Admin <span class="pk">Member App</span></h1><div class="row"><span class="mut"><i class="dot" id="rt"></i><span id="who"></span></span><button class="btn o s" id="out">Thoát</button></div></div>
    <div class="tabs" id="tabs"></div><div id="view"></div>
  </div>
</div>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script>
const SB_URL = "https://jefqjifauibwdljjeawy.supabase.co";
const SB_KEY = "sb_publishable_8X95POhs5VeHCyJ63BisLA_LKZfg6H2";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => Number(n).toLocaleString("vi-VN", { maximumFractionDigits: 2 });
const when = t => new Date(t).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2500); };
const S = { tab: "members", q: "", cats: [], me: null, open: null };
const TABS = [["members", "Member"], ["cats", "Hạng mục điểm"], ["log", "Nhật ký"]];
const REASONS = ["Workshop", "Sit & Go", "Kết quả giải", "Đổi vé", "Đổi nước", "Điều chỉnh sai sót"];

/* ----- Đăng nhập ----- */
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show("login");
  const { data: st, error: se } = await sb.from("staff").select("name,active").eq("user_id", session.user.id).maybeSingle();
  if (se) { await sb.auth.signOut(); show("login"); $("#lerr").textContent = "Lỗi truy cập dữ liệu: " + se.message + (se.code ? " (" + se.code + ")" : ""); return; }
  if (!st || !st.active) { await sb.auth.signOut(); show("login"); $("#lerr").textContent = "Tài khoản này chưa được cấp quyền nhân viên."; return; }
  S.me = st; $("#who").textContent = st.name; show("main"); await loadCats(); render(); listen();
}
function show(w) { $("#login").hidden = w !== "login"; $("#main").hidden = w !== "main"; }
$("#lgo").onclick = async () => {
  $("#lerr").textContent = ""; $("#lgo").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  $("#lgo").disabled = false;
  if (error) { $("#lerr").textContent = "Sai email hoặc mật khẩu."; return; }
  start();
};
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#lgo").click(); };
$("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ----- Realtime: mọi thay đổi từ nhân viên khác hoặc bot hiện ngay ----- */
let tmr;
function listen() {
  const ch = sb.channel("admin");
  ["balances", "point_ledger", "members", "point_categories"].forEach(t =>
    ch.on("postgres_changes", { event: "*", schema: "public", table: t }, () => { clearTimeout(tmr); tmr = setTimeout(refresh, 300); }));
  ch.subscribe(s => $("#rt").classList.toggle("on", s === "SUBSCRIBED"));
}
async function refresh() { if (S.tab === "cats") await loadCats(); render(); if (S.open) openMember(S.open, true); }

async function loadCats() {
  const { data } = await sb.from("point_categories").select("*").order("sort");
  S.cats = data || [];
}
const catName = k => (S.cats.find(c => c.key === k) || {}).name || k;

/* ----- Màn hình ----- */
function render() {
  $("#tabs").innerHTML = TABS.map(t => '<button class="tab' + (S.tab === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + "</button>").join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  ({ members: vMembers, cats: vCats, log: vLog })[S.tab]();
}

async function vMembers() {
  const v = $("#view");
  v.innerHTML = '<div class="row" style="margin:12px 0"><input id="q" class="g" placeholder="Tìm theo SĐT, mã hoặc tên" value="' + esc(S.q) + '"><button class="btn" id="add">+ Thêm</button></div><div class="card" id="list">Đang tải...</div>';
  $("#q").oninput = e => { S.q = e.target.value.trim(); clearTimeout(vMembers.h); vMembers.h = setTimeout(vMembers, 250); };
  $("#add").onclick = addMember;
  let q = sb.from("members").select("id,code,name,phone,balances(category,total)").order("created_at", { ascending: false }).limit(50);
  if (S.q) { const k = S.q.replace(/[%,()]/g, ""); q = q.or("phone.ilike.%" + k + "%,code.ilike.%" + k + "%,name.ilike.%" + k + "%"); }
  const { data, error } = await q;
  if (error) { $("#list").innerHTML = '<span class="bad">' + esc(error.message) + "</span>"; return; }
  $("#list").innerHTML = data.length ? data.map(m =>
    '<div class="li" data-id="' + m.id + '"><div class="av">' + esc((m.name || "?")[0].toUpperCase()) + '</div><div class="g"><b>' + esc(m.name || "(chưa có tên)") + '</b> <span class="mut">' + esc(m.code) + " · " + esc(m.phone) + "</span><div>" +
    (m.balances || []).filter(b => Number(b.total) !== 0).map(b => '<span class="chip">' + esc(catName(b.category)) + ": <b>" + num(b.total) + "</b></span>").join("") + "</div></div></div>").join("")
    : '<span class="mut">Chưa có member nào. Bấm + Thêm hoặc để member đăng ký qua bot.</span>';
  $("#list").querySelectorAll(".li").forEach(el => el.onclick = () => openMember(el.dataset.id));
}

function sheet(html) { $("#box").innerHTML = html; $("#sheet").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); S.open = null; }
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

function addMember() {
  sheet('<h2>Thêm member</h2><label>Số điện thoại (10 số)</label><input id="np" inputmode="numeric" placeholder="0901234567"><label>Họ tên</label><input id="nn"><div class="err" id="ne"></div><div class="row" style="margin-top:12px"><button class="btn o g" id="nc">Hủy</button><button class="btn g" id="ns">Lưu</button></div>');
  $("#nc").onclick = closeSheet;
  $("#ns").onclick = async () => {
    const phone = $("#np").value.replace(/\D/g, ""), name = $("#nn").value.trim();
    if (!/^0\d{9}$/.test(phone)) { $("#ne").textContent = "Số điện thoại phải gồm 10 số, bắt đầu bằng 0."; return; }
    const { error } = await sb.from("members").insert({ phone, name: name || null });
    if (error) { $("#ne").textContent = error.code === "23505" ? "Số điện thoại này đã có." : error.message; return; }
    closeSheet(); toast("Đã thêm member"); vMembers();
  };
}

async function openMember(id, silent) {
  S.open = id;
  const [m, l] = await Promise.all([
    sb.from("members").select("id,code,name,phone,dob,email,area,created_at,telegram_id,balances(category,total)").eq("id", id).maybeSingle(),
    sb.from("point_ledger").select("category,delta,reason,created_at,staff_id").eq("member_id", id).order("id", { ascending: false }).limit(30)]);
  const x = m.data; if (!x) return closeSheet();
  const keep = silent && $("#cat") ? { c: $("#cat").value, d: $("#dl").value, r: $("#rs").value } : null;
  const bal = Object.fromEntries((x.balances || []).map(b => [b.category, b.total]));
  sheet('<div class="row sp"><div><h2 style="margin:0">' + esc(x.name || "(chưa có tên)") + '</h2><div class="mut">' + esc(x.code) + " · " + esc(x.phone) + (x.telegram_id ? " · Telegram" : " · chưa liên kết Telegram") + '</div></div><button class="btn o s" id="cl">Đóng</button></div>' +
    '<div class="g3" style="margin:12px 0">' + S.cats.filter(c => c.active).map(c => '<div class="card" style="margin:0"><div class="mut">' + esc(c.name) + '</div><div class="num ' + (c.kind === "wallet" ? "gd" : "pk") + '">' + num(bal[c.key] || 0) + "</div></div>").join("") + "</div>" +
    '<div class="card"><b>Cộng / trừ điểm</b><div class="row wr"><div class="g"><label>Hạng mục</label><select id="cat">' + S.cats.filter(c => c.active).map(c => '<option value="' + esc(c.key) + '">' + esc(c.name) + "</option>").join("") + '</select></div>' +
    '<div class="g"><label>Số điểm (âm để trừ)</label><input id="dl" type="number" step="any" inputmode="decimal" placeholder="+3 hoặc -2"></div></div>' +
    '<label>Lý do (bắt buộc)</label><input id="rs" placeholder="Ví dụ: Workshop 169"><div style="margin-top:6px">' + REASONS.map(r => '<span class="chip" data-r="' + esc(r) + '" style="cursor:pointer">' + esc(r) + "</span>").join("") + '</div><div class="err" id="ae"></div><button class="btn" style="width:100%;margin-top:8px" id="ap">Xác nhận</button></div>' +
    "<h2>Lịch sử điểm</h2>" + ((l.data || []).length ? '<table><tr><th>Lúc</th><th>Hạng mục</th><th>Điểm</th><th>Lý do</th></tr>' + l.data.map(r => "<tr><td>" + when(r.created_at) + "</td><td>" + esc(catName(r.category)) + '</td><td class="' + (r.delta > 0 ? "ok" : "bad") + '"><b>' + (r.delta > 0 ? "+" : "") + num(r.delta) + "</b></td><td>" + esc(r.reason) + "</td></tr>").join("") + "</table>" : '<span class="mut">Chưa có thay đổi điểm.</span>'));
  if (keep) { $("#cat").value = keep.c; $("#dl").value = keep.d; $("#rs").value = keep.r; }
  $("#cl").onclick = closeSheet;
  $("#box").querySelectorAll("[data-r]").forEach(c => c.onclick = () => { $("#rs").value = c.dataset.r; });
  $("#ap").onclick = async () => {
    const d = Number($("#dl").value), r = $("#rs").value.trim(), er = $("#ae");
    if (!d) { er.textContent = "Nhập số điểm khác 0."; return; }
    if (!r) { er.textContent = "Cần nhập lý do."; return; }
    $("#ap").disabled = true;
    const { data, error } = await sb.rpc("adjust_points", { p_member: id, p_category: $("#cat").value, p_delta: d, p_reason: r });
    $("#ap").disabled = false;
    if (error) { er.textContent = error.message; return; }
    toast("Đã cập nhật. Số dư mới: " + num(data)); $("#dl").value = ""; $("#rs").value = ""; openMember(id, true); vMembers();
  };
}

async function vCats() {
  const v = $("#view");
  v.innerHTML = '<p class="mut">Hạng mục "wallet" là điểm tiêu được, không cho âm (WP, điểm nước). Hạng mục "score" là điểm tích lũy để xếp hạng, được phép âm.</p><div class="card">' +
    S.cats.map(c => '<div class="row wr" style="padding:8px 0;border-bottom:1px solid var(--line)" data-k="' + esc(c.key) + '"><div class="g" style="flex:1 1 100%"><input class="cn" value="' + esc(c.name) + '"></div><div class="mut" style="width:120px">' + esc(c.key) + " · " + c.kind + '</div><input class="cs" type="number" style="width:80px" value="' + c.sort + '"><label style="margin:0;display:flex;gap:6px;align-items:center"><input class="ca" type="checkbox" style="width:auto"' + (c.active ? " checked" : "") + '>Bật</label><button class="btn s sv">Lưu</button></div>').join("") + "</div>" +
    '<div class="card"><b>Thêm hạng mục mới</b><div class="row wr"><div class="g"><label>Mã (chữ thường, không dấu)</label><input id="ck" placeholder="vi_du"></div><div class="g"><label>Tên hiển thị</label><input id="cn2"></div><div class="g"><label>Loại</label><select id="ct"><option value="wallet">wallet (tiêu được)</option><option value="score">score (xếp hạng)</option></select></div></div><div class="err" id="ce"></div><button class="btn" id="cadd">Thêm</button></div>';
  v.querySelectorAll("[data-k]").forEach(row => row.querySelector(".sv").onclick = async () => {
    const { error } = await sb.from("point_categories").update({ name: row.querySelector(".cn").value.trim(), sort: Number(row.querySelector(".cs").value) || 100, active: row.querySelector(".ca").checked }).eq("key", row.dataset.k);
    toast(error ? error.message : "Đã lưu"); if (!error) loadCats();
  });
  $("#cadd").onclick = async () => {
    const key = $("#ck").value.trim(), name = $("#cn2").value.trim();
    if (!/^[a-z0-9_]+$/.test(key) || !name) { $("#ce").textContent = "Mã chỉ gồm chữ thường, số, gạch dưới; và cần nhập tên."; return; }
    const { error } = await sb.from("point_categories").insert({ key, name, kind: $("#ct").value, sort: 100 });
    if (error) { $("#ce").textContent = error.code === "23505" ? "Mã này đã tồn tại." : error.message; return; }
    toast("Đã thêm hạng mục"); await loadCats(); vCats();
  };
}

async function vLog() {
  const v = $("#view"); v.innerHTML = '<div class="card">Đang tải...</div>';
  const [a, s] = await Promise.all([sb.from("audit_log").select("*").order("id", { ascending: false }).limit(100), sb.from("staff").select("user_id,name")]);
  const nm = Object.fromEntries((s.data || []).map(x => [x.user_id, x.name]));
  v.innerHTML = '<div class="card" style="overflow:auto">' + ((a.data || []).length ? '<table><tr><th>Lúc</th><th>Nhân viên</th><th>Thao tác</th><th>Chi tiết</th></tr>' + a.data.map(r => "<tr><td>" + when(r.created_at) + "</td><td>" + esc(nm[r.staff_id] || "") + "</td><td>" + esc(r.action) + "</td><td>" +
    (r.detail ? esc(catName(r.detail.category)) + " " + (r.detail.delta > 0 ? "+" : "") + num(r.detail.delta || 0) + " · " + esc(r.detail.reason || "") : "") + "</td></tr>").join("") + "</table>" : '<span class="mut">Chưa có thao tác nào.</span>') + "</div>";
}
start();
</script>
</body>
</html>
